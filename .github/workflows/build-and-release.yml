name: Build & Release

# 分支驱动发版：
# - push dev   → beta 通道：<base>-beta，GitHub pre-release，只发包
# - push main  → stable 通道：<base>（要求纯 X.Y.Z），GitHub 正式版（latest），文案取仓库根 Changes.md，
#   随后联动部署 web 版（landing + web）
# - 手动触发（workflow_dispatch）：自选 channel（beta/stable）与可选版本号，用于 Actions 开启后补发
# 版本号唯一来源：packages/desktop/package.json（写纯 X.Y.Z）。
# 本地指定版本：DIST_VERSION=X.Y.Z npm run dist:alpha（见 scripts/sync-desktop-version.mjs）。
# 注意：本仓库不用 OSS 分发（上游渠道，已移除 publish-oss / publish-changelog；
# 更新检测与下载页直接读本仓库的 GitHub Releases）。
on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel: beta = pre-release (re-runnable), stable = formal release from Changes.md"
        required: true
        type: choice
        options: [beta, stable]
      version:
        description: "Base version X.Y.Z (defaults to packages/desktop/package.json)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  # 版本解析：push 按分支定通道（dev→beta，main→stable）；
  # 手动触发按 inputs.channel 定通道，inputs.version 为空时取 package.json。
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
      stable: ${{ steps.ver.outputs.stable }}
    steps:
      - uses: actions/checkout@v7
      - id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            channel="${{ inputs.channel }}"
            input_ver="${{ inputs.version }}"
          elif [[ "${{ github.ref_name }}" == "dev" ]]; then
            channel="beta"
            input_ver=""
          else
            channel="stable"
            input_ver=""
          fi
          if [[ -n "$input_ver" ]]; then
            raw="$input_ver"
          else
            raw=$(node -p "require('./packages/desktop/package.json').version")
          fi
          base="${raw%%-*}"
          if ! [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::base version must be X.Y.Z, got: $raw"
            exit 1
          fi
          if [[ "$channel" == "beta" ]]; then
            echo "version=${base}-beta" >> "$GITHUB_OUTPUT"
            echo "tag=v${base}-beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            if [[ "$raw" != "$base" ]]; then
              echo "::error::stable releases require a plain X.Y.Z version (got $raw)"
              exit 1
            fi
            if [[ ! -f Changes.md ]]; then
              echo "::error::Changes.md is required as the stable release notes"
              exit 1
            fi
            echo "version=${base}" >> "$GITHUB_OUTPUT"
            echo "tag=v${base}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi

  # 发版门禁：lint + build + typecheck + 全 workspace 单测 + i18n check。
  # 失败则 create-release/build 均不启动（不产生空 release，避免阻塞同版本重推）。
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19

      - name: Install dependencies (skip native compilation)
        run: npm ci --ignore-scripts

      - name: Download Electron binary
        shell: bash
        run: node node_modules/electron/install.js

      - name: Verify (lint + build + typecheck + unit tests + i18n)
        run: npm run verify

  create-release:
    needs: [meta, verify]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      # beta 允许反复推送覆盖：先删同名旧 release（含 tag），保证重推不卡住；
      # stable 通道禁止覆盖——同名 release 已存在则直接失败，防止误覆盖正式版。
      - name: Delete previous beta release (dev only)
        if: needs.meta.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "$TAG" --cleanup-tag -y || true
      - name: Create beta pre-release
        if: needs.meta.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" --title "$TAG" --prerelease --generate-notes
      - name: Create stable release from Changes.md
        if: needs.meta.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" --title "$TAG" --notes-file Changes.md

  build:
    needs: [meta, create-release]
    env:
      RELEASE_VERSION: ${{ needs.meta.outputs.version }}
      RELEASE_TAG: ${{ needs.meta.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build-args: --mac
            artifact: dmg
            arch-label: arm64
            target-arch: arm64
          - os: macos-latest
            build-args: --mac --x64
            artifact: dmg
            arch-label: intel
            target-arch: x64
          - os: windows-latest
            build-args: --win --x64
            artifact: exe
            arch-label: ""
            target-arch: x64
          - os: windows-latest
            build-args: --win --arm64
            artifact: exe
            arch-label: ""
            target-arch: arm64
          - os: ubuntu-latest
            build-args: --linux --x64
            artifact: linux
            arch-label: ""
            target-arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19

      - name: Install dependencies (skip native compilation)
        run: npm ci --ignore-scripts

      - name: Sync app version from release meta
        shell: bash
        working-directory: packages/desktop
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - name: Build desktop chain (i18n -> presets -> sdk -> core -> server -> desktop)
        run: npm run build:desktop

      - name: Download Electron binary
        shell: bash
        run: node node_modules/electron/install.js

      - name: Rebuild native deps for Electron (better-sqlite3)
        env:
          BUILD_TARGET_ARCH: ${{ matrix.target-arch }}
        run: node scripts/rebuild-native.mjs

      - name: Build installer (electron-builder)
        working-directory: packages/desktop
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" && -z "${CSC_LINK:-}${CSC_NAME:-}" ]]; then
            unset CSC_LINK CSC_NAME CSC_KEY_PASSWORD
            npx electron-builder ${{ matrix.build-args }} --config.mac.identity=- --config.mac.hardenedRuntime=false --publish never
          else
            npx electron-builder ${{ matrix.build-args }} --publish never
          fi

      - name: Install Xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Smoke test packaged app
        # 只在 runner 架构与目标架构一致的 matrix job 上执行（mac arm64 / win x64 / linux x64）：
        # mac intel 交叉构建需 Rosetta、win arm64 无法在 x64 runner 上运行，均跳过
        if: >-
          (runner.os == 'macOS' && matrix.target-arch == 'arm64') ||
          (runner.os == 'Windows' && matrix.target-arch == 'x64') ||
          (runner.os == 'Linux' && matrix.target-arch == 'x64')
        working-directory: packages/desktop
        shell: bash
        env:
          SPHERSE_SMOKE: "1"
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a bash -c 'SPHERSE_SMOKE_VERSION="$RELEASE_VERSION" npx playwright test -c playwright.config.ts e2e/packaged-smoke.spec.ts'
          else
            SPHERSE_SMOKE_VERSION="$RELEASE_VERSION" npx playwright test -c playwright.config.ts e2e/packaged-smoke.spec.ts
          fi

      - name: Upload macOS dmg
        if: runner.os == 'macOS'
        working-directory: packages/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv release/*.dmg "release/Spherse-${RELEASE_VERSION}-${{ matrix.arch-label }}.dmg"
          gh release upload "$RELEASE_TAG" release/*.dmg --clobber

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        working-directory: packages/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 只上传本 job arch 后缀的安装包：x64/arm64 两个 matrix job 并发运行，
        # 若按 release/*.exe 全量上传，双 arch 时产物同名会并发 --clobber 互踩（曾致 HTTP 404）。
        # 同时上传 blockmap（electron-updater 增量下载）与 latest.yml（in-app 更新 feed）：
        # electron-updater 在 Windows 上 channel 文件名恒为 ${channel}.yml，双 arch feed 需两个文件，
        # arm64 job 的 yml 重命名为 latest-arm64.yml 避免与 x64 job 的 latest.yml 同名互踩。
        run: |
          shopt -s nullglob
          exes=(release/*-${{ matrix.target-arch }}.exe)
          blockmaps=(release/*-${{ matrix.target-arch }}.exe.blockmap)
          ymls=()
          if [[ -f release/latest.yml ]]; then
            if [[ "${{ matrix.target-arch }}" == "arm64" ]]; then
              mv release/latest.yml release/latest-arm64.yml
              ymls=(release/latest-arm64.yml)
            else
              ymls=(release/latest.yml)
            fi
          fi
          gh release upload "$RELEASE_TAG" "${exes[@]}" "${blockmaps[@]}" "${ymls[@]}" --clobber

      - name: Upload Linux packages
        if: runner.os == 'Linux'
        working-directory: packages/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" release/*.AppImage release/*.deb --clobber

  # 发版完成后联动部署 web 版（GitHub Pages：landing + web）。
  # 仅 stable 通道执行（push main 或手动 stable）：beta 预发布不刷 Pages。
  # GITHUB_TOKEN 触发的事件默认不会级联 workflow run，但 workflow_dispatch 是官方例外，
  # 因此用 gh workflow run（需要 actions: write 权限）触发 deploy-pages.yml；
  # stable 通道 ref 用分支名（push 时刻即发版 commit，内容一致）。
  deploy-web:
    needs: [meta, build]
    if: >-
      github.event_name == 'push' &&
      needs.build.result == 'success' &&
      needs.meta.outputs.stable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Trigger Pages deploy (landing + web)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-pages.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${GITHUB_REF_NAME}" \
            -f include_web=true
